name: Sales CRM CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pipi2303/salesappv20

jobs:
  build-and-deploy:
    name: Build & Deploy Sales CRM
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================
      # 2. Setup Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 3. Login to GHCR
      # ==========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 4. Generate Docker image metadata
      # ==========================================
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # ==========================================
      # 5. Build & Push Docker image
      # ==========================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 6. Trigger Portainer
      # ==========================================
      - name: Deploy to Portainer
        if: env.PORTAINER_WEBHOOK != ''
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "$PORTAINER_WEBHOOK"

      # ==========================================
      # 7. Deployment information
      # ==========================================
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Sales CRM deployment completed"
          echo "=========================================="
          echo "Image:"
          echo "ghcr.io/pipi2303/salesappv20:latest"
          echo ""
          echo "Platform:"
          echo "linux/amd64"
          echo ""
          echo "Commit:"
          echo "${GITHUB_SHA}"
          echo "=========================================="
