name: Sales CRM CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pipi2303/salesappv20

jobs:
  build-and-deploy:
    name: Build & Deploy Sales CRM
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5


      # ==========================================
      # 2. Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================
      # 3. Login to GHCR
      # ==========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # 4. Docker Metadata
      # ==========================================
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha


      # ==========================================
      # 5. Build & Push Docker Image
      # ==========================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ==========================================
      # 6. Deploy to Portainer
      # ==========================================
      - name: Deploy to Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          STACK_NAME: sales-crm

        run: |

          echo "=========================================="
          echo "Deploying Sales CRM to Portainer"
          echo "=========================================="

          COMPOSE_JSON=$(jq -Rs . < docker-compose.yml)

          # Cari stack berdasarkan nama
          STACK_ID=$(curl -s --insecure \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${PORTAINER_URL}/api/stacks?endpointId=${PORTAINER_ENDPOINT_ID}" \
            | jq -r ".[] | select(.Name == \"${STACK_NAME}\") | .Id")

          if [ -n "$STACK_ID" ]; then
            echo "Stack ditemukan (ID: ${STACK_ID}), update..."
            # Preserve env vars yang sudah di-set di Portainer UI
            CURRENT_ENV=$(curl -s --insecure \
              -H "X-API-Key: ${PORTAINER_TOKEN}" \
              "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
              | jq '.Env // []')
            curl --fail-with-body --silent --show-error --insecure \
              -X PUT \
              -H "X-API-Key: ${PORTAINER_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{
                \"StackFileContent\": ${COMPOSE_JSON},
                \"Env\": ${CURRENT_ENV},
                \"Prune\": false,
                \"RepullImageAndRedeploy\": true
              }" \
              "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}"
          else
            echo "Stack belum ada, buat baru..."
            curl --fail-with-body --silent --show-error --insecure \
              -X POST \
              -H "X-API-Key: ${PORTAINER_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{
                \"Name\": \"${STACK_NAME}\",
                \"StackFileContent\": ${COMPOSE_JSON},
                \"Env\": []
              }" \
              "${PORTAINER_URL}/api/stacks/create/standalone/string?endpointId=${PORTAINER_ENDPOINT_ID}"
          fi

          echo ""
          echo "=========================================="
          echo "Portainer deployment completed"
          echo "=========================================="


      # ==========================================
      # 7. Deployment Summary
      # ==========================================
      - name: Deployment Summary
        run: |

          echo "=========================================="
          echo "Sales CRM deployment completed"
          echo "=========================================="

          echo "Image:"
          echo "ghcr.io/pipi2303/salesappv20:latest"

          echo ""

          echo "Platform:"
          echo "linux/amd64"

          echo ""

          echo "Portainer:"
          echo "Stack: sales-crm"
          echo "Endpoint ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}"

          echo ""

          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo "=========================================="