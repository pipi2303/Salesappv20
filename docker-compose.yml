# Portainer stack "sales-crm-onduline" -- deployed via
# .github/workflows/deploy.yml: GitHub Actions builds this repo's
# Dockerfile, pushes the image to GHCR, then PUTs this file's content
# straight to Portainer's Stacks API with RepullImageAndRedeploy=true.
# That means Portainer PULLS the image below on every deploy -- it does
# NOT build from a git checkout -- so `image:` must point at the tag
# Actions actually pushes (ghcr.io/pipi2303/salesappv20:latest), and
# there must be no `build:` block here (a bare local tag like
# "sales-crm-onduline:latest" with RepullImageAndRedeploy=true fails
# with "pull access denied ... repository does not exist", since Docker
# tries to pull that name from Docker Hub instead of building it).
#
# NOTE: ghcr.io/pipi2303/salesappv20 must be a public package, or the
# VPS's Docker daemon needs `docker login ghcr.io` credentials -- GitHub
# Actions logging in on the runner (see deploy.yml) does not carry over
# to the VPS pulling the image.
services:
  app:
    image: ghcr.io/pipi2303/salesappv20:latest
    container_name: sales-crm-onduline
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Check-in photos (Bab 8 gap 2), when lib/blob.ts's local-disk
      # backend is active (default here -- no BLOB_READ_WRITE_TOKEN set).
      # Named volume so photos survive a redeploy (a fresh pulled image
      # would otherwise not have them -- they never lived in the image
      # to begin with).
      - checkin_photos:/app/uploads/checkin-photos
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Neon Postgres -- pooled (runtime queries) and direct (migrations)
      # connection strings. Same values as this repo's .env.local.
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      # Optional: Vercel Blob storage token for check-in photos
      # (lib/blob.ts). Leave unset to use local disk storage (the
      # `checkin_photos` volume above) instead -- no external account
      # needed. Set this only if you specifically want photos to live in
      # Vercel Blob (e.g. this app is also deployed on Vercel and you
      # want one shared photo store).
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}

volumes:
  checkin_photos:
